name: CI (self-hosted)

# The platform-independent tests on the org's self-hosted runners, for fast
# feedback on every branch pushed to this repository.
#
# The security boundary is the trigger. Forks cannot raise a `push` event on
# this repository (a fork's pushes run in the fork's own Actions context, which
# cannot see our runners), and `workflow_dispatch` needs write access. So fork
# code never reaches this workflow, whatever a pull request does to the file.
#
# Only TranscribeCore runs here, because the self-hosted runners are Linux. The
# macOS build is in ci.yml on GitHub-hosted runners.
#
# Reaching the runners needs this repository added to the `public-ci` runner
# group. See docs/self-hosted-ci.md.
#
# Job IDs deliberately differ from ci.yml's so the two workflows never report
# to the same status-check context.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-self-hosted:
    name: core-tests (self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # The public runners are bare myoung34/github-runner:ubuntu-noble
      # containers: root inside the container, but no `file` binary (which
      # swift-actions/setup-swift needs) and no tool cache kept between jobs.
      # So the toolchain comes straight from swift.org on every run, checked
      # against Swift's signing keys. Same version as ci.yml's swift:6.1.
      - name: Install Swift
        env:
          SWIFT_VERSION: "6.1.3"
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # Swift's documented Ubuntu 24.04 dependencies.
          apt-get install -y -qq --no-install-recommends \
            binutils ca-certificates curl git gnupg2 libc6-dev libcurl4-openssl-dev \
            libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 \
            libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev

          name="swift-$SWIFT_VERSION-RELEASE-ubuntu24.04"
          url="https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2404/swift-$SWIFT_VERSION-RELEASE/$name.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o swift.tar.gz "$url"
          curl -fsSL -o swift.tar.gz.sig "$url.sig"

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          curl -fsSL https://www.swift.org/keys/all-keys.asc | gpg --batch --quiet --import
          gpg --batch --verify swift.tar.gz.sig swift.tar.gz

          tar -xzf swift.tar.gz
          rm swift.tar.gz
          echo "$RUNNER_TEMP/$name/usr/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: swift --version

      - name: Test TranscribeCore on Linux
        run: swift test --package-path Packages/TranscribeKit
